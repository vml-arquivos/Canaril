services:
  postgres:
    image: postgres:16-alpine
    container_name: vittabird-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vittabird}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env local}
      POSTGRES_DB: ${POSTGRES_DB:-vittabird}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [vittabird-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vittabird} -d ${POSTGRES_DB:-vittabird}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vittabird-app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vittabird}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vittabird}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET com pelo menos 32 caracteres}
      SESSION_SECRET: ${SESSION_SECRET:-}
      CSRF_SECRET: ${CSRF_SECRET:-}
      OWNER_NAME: ${OWNER_NAME:-Administrador}
      OWNER_OPEN_ID: ${OWNER_OPEN_ID:-local-admin}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      VITE_APP_ID: ${VITE_APP_ID:-vittabird}
      VITE_APP_TITLE: ${VITE_APP_TITLE:-VittaBird}
      VITE_APP_LOGO: ${VITE_APP_LOGO:-}
      NODE_ENV: production
      PORT: "3000"
      APP_TIME_ZONE: ${APP_TIME_ZONE:-America/Sao_Paulo}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      COOKIE_HTTP_ONLY: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      UPLOADS_DIR: /app/uploads
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks: [vittabird-network]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:

networks:
  vittabird-network:
    driver: bridge
